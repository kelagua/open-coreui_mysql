name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "src-tauri/**"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # 1. 编译前端并缓存
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-frontend.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Frontend Cache Key
        id: frontend-hash
        run: |
          HASH=$(find frontend/src frontend/static frontend/package.json frontend/bun.lock frontend/vite.config.ts frontend/svelte.config.js frontend/tailwind.config.js -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache Frontend Build
        id: cache-frontend
        uses: actions/cache@v4
        with:
          path: frontend/build/
          key: frontend-build-${{ steps.frontend-hash.outputs.hash }}
          restore-keys: |
            frontend-build-

      - uses: oven-sh/setup-bun@v2
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        with:
          bun-version: latest

      - name: Build Frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: make build-frontend

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  # 2. 编译后端和桌面端 (仅限 Win x64 和 Ubuntu x64)
  build:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: "rust-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.0.0-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Download Frontend Build
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          mkdir -p bin
          cd backend
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/open-webui-rust ../bin/open-coreui-${{ matrix.target }}
          cd ..
          cargo tauri build --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          mkdir bin
          cd backend
          cargo build --release --target ${{ matrix.target }}
          copy target/${{ matrix.target }}/release/open-webui-rust.exe ..\bin\open-coreui-${{ matrix.target }}.exe
          cd ..
          cargo tauri build --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            bin/open-coreui-${{ matrix.target }}*
          if-no-files-found: error

  # 3. 发布 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: build-*

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          VERSION=$(cat src-tauri/tauri.conf.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')

          # 桌面端安装包
          find artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find artifacts -name "*.msi" -exec cp {} release-assets/ \;
          find artifacts -name "*-setup.exe" -exec cp {} release-assets/ \;

          # 后端二进制重命名
          [ -f artifacts/build-x86_64-unknown-linux-gnu/open-coreui-x86_64-unknown-linux-gnu ] && cp artifacts/build-x86_64-unknown-linux-gnu/open-coreui-x86_64-unknown-linux-gnu release-assets/open-coreui-${VERSION}-x86_64-linux
          [ -f artifacts/build-x86_64-pc-windows-msvc/open-coreui-x86_64-pc-windows-msvc.exe ] && cp artifacts/build-x86_64-pc-windows-msvc/open-coreui-x86_64-pc-windows-msvc.exe release-assets/open-coreui-${VERSION}-x86_64-win.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
